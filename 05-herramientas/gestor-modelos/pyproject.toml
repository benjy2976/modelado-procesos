[project]
name = "mesa-modelamiento"
version = "0.1.0"
description = "Backend local de la mesa de modelamiento de procesos"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.120,<1",
  "filelock>=3.16,<4",
  "httpx2>=2.16,<3",
  "lxml>=5,<7",
  "mcp>=2,<3",
  "pdfminer.six>=20250506,<20270000",
  "pypdf>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.scripts]
modelador-procesos = "mesa_modelamiento.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mesa_modelamiento"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
