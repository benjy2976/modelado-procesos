  texto_citado: El EPI debe utilizarse cuando existan riesgos para la seguridad o salud de los trabajadores que
    no hayan podido eliminarse o controlarse convenientemente por medios técnicos de protección colectiva o mediante
    medidas, métodos o procedimientos de organización de trabajo. En tal sentido, todo el personal que labore en
    una obra de construcción, debe contar con el EPI acorde con los peligros a los que estará expuesto.
