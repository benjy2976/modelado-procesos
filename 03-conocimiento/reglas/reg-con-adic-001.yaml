enunciado: En bienes, servicios y consultorias de obras, la autoridad de la gestion administrativa puede ordenar
  prestaciones adicionales hasta por el 25% del monto del contrato original, si son indispensables, y puede reducir
  bienes, servicios, consultorias u obras hasta por el mismo porcentaje.
