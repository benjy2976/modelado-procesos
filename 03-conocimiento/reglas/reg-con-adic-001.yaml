  texto_citado: 64.1. En caso de bienes, servicios y consultorías de obras, la autoridad de la gestión administrativa
    puede autorizar, ordenar y pagar directamente la ejecución de prestaciones adicionales hasta por el 25 % del
    monto del contrato original, siempre que sean indispensables para alcanzar la finalidad del contrato. Asimismo,
    puede reducir bienes, servicios, consultorías u obras hasta por el mismo porcentaje.
