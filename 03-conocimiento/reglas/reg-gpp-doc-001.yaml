  texto_citado: El procedimiento contiene la descripción de las tareas que conforman un proceso , su objetivo es
    mostrar el flujo de información que comprenden las tareas, así como los roles de las unidades de organización
    que participan en la ejecución del proceso, por lo tanto, su desarrollo solo aplicaría para los procesos de
    último nivel . No todos los procesos deben contar con un procedimiento y no debe disponerse de más de un procedimiento
    por proceso.
