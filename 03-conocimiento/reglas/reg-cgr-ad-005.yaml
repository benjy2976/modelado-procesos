id_regla: REG-CGR-AD-005
titulo: Paralizacion de obra por administracion directa
dominio: control-gubernamental
tipo_regla: PROCEDIMIENTO
enunciado: En administracion directa, ante supuestos como desabastecimiento, demoras en aprobar modificaciones o
  consultas, o fuerza mayor, el residente informa al inspector o supervisor mediante el cuaderno de obra; determinada
  la paralizacion, emite un informe y solicita la modificacion del plazo, registrando fechas de solicitud, de paralizacion
  y de reinicio.
