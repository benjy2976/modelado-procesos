  texto_citado: 215.1. El contratista presenta la liquidación debidamente sustentada con los cálculos y adjuntando
    la documentación correspondiente en el plazo indicado en el numeral 215.6, contado desde el día siguiente de
    otorgada la conformidad de la última prestación, de la recepción de la obra o desde que la JPRD emite la última
    opinión vinculante sobre controversias generadas hasta la recepción de la obra, de consentida la resolución
    del contrato o de que haya quedado resuelta y consentida la última controversia, seg ún sea el caso.
