  texto_citado: '176.1. El inicio del plazo de ejecución contractual de obras rige desde que la entidad contratante
    cumpla con las siguientes condiciones: a) Entrega de la actualización del expediente técnico o de la documentación
    técnica necesaria para que realice el diseño correspondiente, según corresponda, en caso estos se hubiesen modificado
    con ocasión del procedimiento de selección. b) Comunicación al contratista en la que se identifique aquél que
    está a cargo de la supervisión de la obra o de la supervisión del componente del diseño, según corresponda.
    c) Entrega del adelanto directo, en caso este haya sido solicitado por el contratista, en las condiciones y
    oportunidad establecida en el artículo 179. Esta condición no aplica cuando el adelanto directo se garantiza
    mediante fideicomiso. d) La suscripción del contrato tripartito para la conformación de la JPRD, de corresponder.
    e) En el caso de obras bajo el sistema de entrega de solo construcción, la entrega total o parcial del terreno
    o lugar donde se ejecuta la obra, según corresponda.'
