esquema: regla-normativa-v1
id_regla: REG-GPP-NIV-001
titulo: Determinacion de procesos de nivel 1 hasta el ultimo nivel
dominio: gestion-por-procesos
tipo_regla: PERMISO
enunciado: >-
  A partir de los procesos de nivel 0, los dueños de procesos pueden determinar los procesos de nivel 1 hasta el
  ultimo nivel y deben documentar los procesos determinados mediante sus fichas de producto y proceso y sus
  respectivas fichas de indicador.
actor: dueños de procesos
accion: determinar y documentar
objeto: procesos de nivel 1 hasta el ultimo nivel
condiciones:
  - partir de procesos de nivel 0 previamente determinados
  - seguir las actividades y pasos de la Norma Tecnica 002-2025-PCM-SGP
excepciones: []
plazo: null
evidencias_requeridas:
  - ficha de producto y proceso
  - ficha de indicador de producto o proceso
aplicabilidad:
  procesos:
    - S4.3
  etapas:
    - determinacion de procesos
  modalidades: []
  tipologias: []
  aplica_si:
    - se propone desagregar un proceso de nivel 0 o superior
  no_aplica_si: []
