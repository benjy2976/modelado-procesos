  texto_citado: >-
    A partir de los procesos nivel 0, los dueños de procesos pueden determinar los procesos nivel 1 hasta el ultimo
    nivel, elaborando y aprobando las Fichas de producto y proceso y sus respectivas Fichas de indicador de producto
    o proceso, siguiendo las mismas actividades y pasos establecidos en la presente norma tecnica.
