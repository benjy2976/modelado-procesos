id_regla: REG-CGR-AD-003
titulo: Plan de Abastecimiento de Obra en administracion directa
dominio: control-gubernamental
tipo_regla: PLAZO
enunciado: En administracion directa, dentro de los siete dias calendario de la opinion favorable sobre la revision
  del expediente, el residente elabora el Plan de Abastecimiento de Obra para todo el plazo de ejecucion segun los
  calendarios del expediente, y emite al menos el 80% de los requerimientos de bienes, servicios y personal.
