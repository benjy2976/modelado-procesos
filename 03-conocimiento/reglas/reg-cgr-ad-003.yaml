  texto_citado: Dentro de los siete (7) días calendario de emitido el informe del inspector o supervisor con opinión
    favorable de la revisión del expediente técnico por parte del residente de obra, este último debe elaborar un
    Plan de Abastecimiento de Obra que contemple la provisión de bienes, servicios y personal (incluyendo al personal
    clave restante) para todo el plazo de ejecución de la obra, de acuerdo con los calendarios establecidos en el
    expediente técnico. El inspector o supervisor debe validar que no se requieran adquisiciones o contrataciones
    de bienes, servicios o personal que no estén contemplados en el expediente técnico de la obra, bajo responsabilidad.
    El Plan de Abastecimiento de Obra debe ser remitido a la OAD, al Órgano Encargado de las Contrataciones y a
    la Oﬁ cina de Personal de la entidad o la que haga sus veces. En el mismo plazo señalado en el párrafo anterior,
    el residente debe emitir al menos el ochenta por ciento (80%) de los requerimientos de adquisición o contratación
    de bienes, servicios y personal contemplados en el Plan de Abastecimiento de Obra, los mismos que se remiten
    a la OAD indicando el cumplimiento del porcentaje señalado.
