esquema: regla-normativa-v1
id_regla: REG-CGR-AD-004
titulo: Adquisiciones previas al inicio en administracion directa
dominio: control-gubernamental
tipo_regla: PLAZO
enunciado: Dentro de los sesenta dias calendario siguientes a la emision de al menos el 80% de los requerimientos,
  la entidad realiza las adquisiciones y contrataciones, que deben permitir ejecutar las partidas de al menos los
  primeros treinta dias de obra; no se adquiere nada fuera del Plan de Abastecimiento.
actor: organos o unidades organicas competentes de la entidad
