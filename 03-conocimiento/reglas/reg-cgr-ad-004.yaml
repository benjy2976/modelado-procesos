  texto_citado: Dentro de los sesenta (60) días calendario siguientes al de emitido, al menos, el ochenta por ciento
    (80%) de los requerimientos de adquisición o contratación de bienes, servicios y personal contemplados en el
    Plan de Abastecimiento de Obra, los órganos o las unidades orgánicas competentes de la entidad, deben realizar
    las adquisiciones o contrataciones correspondientes. Estas adquisiciones o contrataciones deben ser suﬁ cientes
    para permitir la ejecución de partidas de obra de al menos los primeros treinta (30) días calendario de trabajo.
    No se pueden adquirir o contratar bienes, servicios o personal para la obra que no estén contemplados en el
    Plan de Abastecimiento de Obra.
