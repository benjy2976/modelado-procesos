  texto_citado: '29.3 Culminada la ejecución física de la inversión y habiéndose efectuado la recepción de los activos
    de acuerdo con la normativa de la materia, la UEI elabora el informe de la culminación de la ejecución física
    de la inversión y registra dicha culminación conforme a la sección B del Formato N° 09: Registro de cierre de
    inversión, en un plazo máximo de hasta sesenta (60) días calendario, contado desde la fecha de la culminación
    física de la inversión'
