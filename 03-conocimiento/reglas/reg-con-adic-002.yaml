  texto_citado: '64.2. Tratándose de obras bajo el sistema de entrega de solo construcción, la autoridad de la gestión
    administrativa puede autorizar la ejecución y el pago de prestaciones adicionales hasta por el 15 % del monto
    total del contrato original, restándole los presupuestos deductivos vinculados. 64.3. En el supuesto referido
    en el párrafo anterior, se contemplan las siguientes excepciones, cuyas condiciones se establecen en el reglamento:
