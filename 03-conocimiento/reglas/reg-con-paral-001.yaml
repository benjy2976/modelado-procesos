esquema: regla-normativa-v1
id_regla: REG-CON-PARAL-001
titulo: Obra publica paralizada
dominio: contrataciones
tipo_regla: DEFINICION
enunciado: Es obra publica paralizada la contratada con avance fisico de al menos 40% cuyo contrato vigente no reporta
  ejecucion fisica por 6 meses o mas, o que proviene de un contrato resuelto o nulo; la paralizacion incluye controversias,
  abandono, deficiencias del expediente u otras situaciones que impidan su continuidad; en administracion directa,
  avance de al menos 50% sin ejecucion por mas de 6 meses.
