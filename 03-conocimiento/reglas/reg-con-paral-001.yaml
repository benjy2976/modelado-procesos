  texto_citado: '2.1. La presente ley aplica a todas las entidades del Estado que tengan a su cargo la ejecución
    de las obras públicas paralizadas, a las que se refiere el artículo 1, contratadas bajo la aplicación de la
    Ley de Contrataciones del Estado, que cuenten con un avance físico igual o mayor al 40% y que, a la fecha del
    registro del inventario al que se refiere el artículo 3 de la presente ley, cumplen con alguno de los siguientes
    supuestos: (i) el contrato se encuentra vigente, pero sin reportar ejecución física por un período igual o mayor
    a 6 (seis) meses; o, (ii) provenga de un contrato resuelto o declarado nulo. 2.2. La paralización incluye situaciones
    de controversias, abandono, deficiencias del expediente técnico, causas no previsibles en el expediente técnico
    u otras situaciones imprevisibles posteriores al perfeccionamiento del contrato que impidan su continuidad,
    culminación o puesta en funcionamiento. 2.3. Se considera obra pública paralizada iniciada bajo la modalidad
    de administración directa aquella que cuente con un avance físico igual o mayor al 50% y que no reporte ejecución
    física por un período mayor a 6 (seis) meses o más a la fecha del registro del inventario a que se refiere el
    artículo 3 de la presente ley.'
