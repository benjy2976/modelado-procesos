  texto_citado: '158.1. La entidad contratante determina uno de los siguientes sistemas de entrega de obra: a) Solo
    construcción: se contrata solo la ejecución de la obra, una vez que se cuenta con el expediente técnico aprobado.
    La responsabilidad del contratista corresponde al componente que ejecuta. La entidad contratante es responsable
    de los errores o deficiencias del expediente técnico. b) Diseño y construcción: el contratista es responsable
    de la elaboración del expediente técnico y de la ejecución de la obra. Se utiliza cuando la entidad contratante
    busca retener menor riesgo del diseño. Puede utilizarse para saldos de obra.'
