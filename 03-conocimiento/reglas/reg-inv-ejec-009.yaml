  texto_citado: 11. Elaborar el programa de mantenimiento de los activos generados con la inversión, así como registrar
    la información proporcionada por las unidades orgánicas de la entidad sobre el mantenimiento de la UP. Dicho
    programa se elabora durante la ejecución física de la inversión y es remitido al responsable de la(s) unidad(es)
    orgánica(s) a cargo de la UP encargada de la prestación de los servicios y al OR para su validación en el marco
