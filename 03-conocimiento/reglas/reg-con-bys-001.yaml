  texto_citado: 144.1. El área usuaria es responsable de brindar la conformidad, para lo cual verifica el cumplimiento
    de las especificaciones técnicas o términos de referencia. En el caso de bienes, realiza el respectivo control
    de calidad, de haberse establecido en el requerimiento. 144.2. En el caso de bienes, la recepción de los bienes
    adquiridos se rige de acuerdo con la normativa del Sistema Nacional de Abastecimiento.
