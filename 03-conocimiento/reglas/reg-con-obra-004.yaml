  texto_citado: 123.4. La parte que comunica la resolución del contrato debe indicar, con al menos tres días hábiles
    de anticipación, la fecha y hora para realizar la constatación física e inventario en la obra. Este acto se
    lleva a cabo en presencia del supervisor y un n otario o juez de paz, en el que se levanta un acta en la que
    se deje constancia del detalle los avances de obra, inventarios de materiales, insumos y equipamientos. Los
    bienes inventariados en la constatación física se encuentran bajo la responsabilidad del contratista hasta la
    culminación del acto. Culminado este acto, la obra queda bajo responsabilidad de la entidad contratante y se
    procede a su liquidación.
