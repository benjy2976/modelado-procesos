enunciado: En la culminacion, el residente anota el hecho en el cuaderno de obra; el inspector o supervisor corrobora
  en cinco dias calendario y, de estar conforme, la unidad responsable designa en cinco dias el Comite de Culminacion
  y Liquidacion.
