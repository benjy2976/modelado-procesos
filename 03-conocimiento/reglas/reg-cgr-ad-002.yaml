  texto_citado: En la fecha de la culminación de la ejecución de la obra, el residente de obra anota el hecho en
    el cuaderno de obra y solicita al inspector o supervisor de obra para que en un plazo no mayor de cinco (5)
    días calendario siguientes a la anotación señalada, corrobore el cumplimiento de lo establecido en el expediente
    técnico y las modiﬁ caciones aprobadas. De encontrarlo conforme, se anota en el cuaderno de obra y comunica
    formalmente a la Unidad Orgánica responsable, de acuerdo con las funciones designadas por la entidad, para que
    en un plazo de cinco (5) días calendario siguientes designe al Comité de Culminación y Liquidación de la ejecución
    de la obra.
