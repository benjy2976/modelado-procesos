esquema: regla-normativa-v1
id_regla: REG-GPP-DIA-001
titulo: Contenido representado en el diagrama del proceso
dominio: gestion-por-procesos
tipo_regla: OBLIGACION
enunciado: >-
  El diagrama del proceso debe representar la secuencia logica e interaccion de sus actividades, los roles que
  intervienen, los elementos de entrada, los productos y las personas que reciben esos productos.
