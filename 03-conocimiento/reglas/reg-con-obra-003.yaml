  texto_citado: 212.1. Culminada la ejecución de la obra el contratista solicita al supervisor la recepción de la
    obra a través de una anotación en el cuaderno de incidencias. El supervisor corrobora el estricto cumplimiento
    de lo establecido en el expediente técnico y la s modificaciones aprobadas por la entidad contratante. En un
    plazo de cinco días contabilizados desde el día siguiente de efectuada la anotación y de encontrarse conforme,
    el supervisor remite a la entidad contratante el certificado de conformidad técnica. De no constatar la culminación
    de la obra anota en el cuaderno de incidencias dicha circunstancia en el mismo plazo. 212.2. Dentro de los cinco
    días hábiles siguientes de remitido el certificado de conformidad técnica, la entidad contratante designa un
    comité de recepción conformado por representantes de la entidad contratante de las carreras de ingeniería o
    arquitectura y/o expertos contratados para ese fin. El supervisor no forma parte del comité. El Colegio de Ingenieros,
    el Colegio de Arquitectos o el representante del Órgano de Control Institucional de la entidad contratante no
    forma parte del comité, pero puede estar presente en la recepción de la obra. 212.3. En un plazo no mayor de
    quince días desde remitido el certificado de conformidad técnica, el comité de recepción de obra verifica in
    situ el cumplimiento contractual, así como el correcto funcionamiento u operatividad de la edificación o infraestruc
    tura culminada y equipos, en caso corresponda. De ser el caso dispone las pruebas para corroborar el cumplimiento
    de las especificaciones técnicas y/o las pruebas operativas que sean necesarias, siempre que estén dentro del
    alcance del contrato. 212.4. Culminada la verificación y de no existir observaciones, el contratista, el supervisor
    y el comité de recepción suscriben el acta de recepción de obra. De existir observaciones, el comité de recepción
    emite un pliego de observaciones y no recibe la obra, comunicando dicha situación al contratista y a la entidad
    contratante.
