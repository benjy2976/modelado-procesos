titulo: Fases de la ejecucion de obras por administracion directa
dominio: control-gubernamental
tipo_regla: DEFINICION
enunciado: La ejecucion de obras por administracion directa requiere expediente tecnico aprobado y actualizado,
  y consta de las fases de aprobacion de la ejecucion, preparacion, ejecucion fisica y culminacion y liquidacion;
  luego la obra se transfiere.
