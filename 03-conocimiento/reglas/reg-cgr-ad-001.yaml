  texto_citado: Para iniciar el proceso de ejecución de obras por administración directa , se debe contar previamente
    con el expediente técnico de obra aprobado, actualizado y contar con el modelado BIM 3D libre de colisiones,
    cuando corresponda. El proceso de ejecución de obras por administración directa consta de las fases de i) aprobación
    de la ejecución; ii) preparación, iii) ejecución física; y, iv) culminación y liquidación; culminada y liquidada
    la obra, esta debe ser transferida internamente (a otra unidad orgánica de la entidad que ejecutó la obra) o
    externamente (a otra entidad diferente de la que ejecutó la obra), la cual estará a cargo de su operación y
    mantenimiento.
